<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visão geral | LavaFlow</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/paginas.css">
</head>
<body class="app" data-area="admin">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="conteudo">
    <header class="cabecalho-pagina">
      <div>
        <p class="rotulo">Unidade Centro</p>
        <h1>Visão geral</h1>
        <p class="texto-suave">Acompanhe a operação e os agendamentos de hoje.</p>
      </div>
      <a href="agenda.html" class="botao">Abrir agenda</a>
    </header>

    <section class="grade-4 estatisticas">
      <div class="cartao"><strong id="stat-agendamentos">-</strong><span class="texto-suave">Agendamentos hoje</span></div>
      <div class="cartao"><strong id="stat-atendimento">-</strong><span class="texto-suave">Veículos em atendimento</span></div>
      <div class="cartao"><strong id="stat-concluidos">-</strong><span class="texto-suave">Concluídos hoje</span></div>
      <div class="cartao"><strong id="stat-faturamento">-</strong><span class="texto-suave">Faturamento previsto</span></div>
    </section>

    <section class="admin-duas-colunas">
      <div class="cartao sem-padding">
        <h2 class="titulo-bloco">Operação de hoje</h2>
        <table class="tabela">
          <thead><tr><th>Horário</th><th>Veículo</th><th>Serviço</th><th>Status</th></tr></thead>
          <tbody id="tabela-hoje"></tbody>
        </table>
      </div>

      <div class="cartao">
        <h2>Capacidade <span class="capacidade-num" id="cap-num"></span></h2>
        <p class="texto-suave">Boxes em uso agora</p>
        <div class="boxes" id="boxes"></div>
        <p><strong id="cap-livres"></strong></p>
      </div>
    </section>
  </main>

  <script src="../js/sidebar.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/visao-geral.js"></script>
</body>
</html>
