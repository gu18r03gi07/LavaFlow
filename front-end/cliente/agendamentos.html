<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus agendamentos | LavaFlow</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/paginas.css">
</head>
<body class="app" data-area="cliente" data-pagina="agendamentos">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="conteudo">
    <header class="cabecalho-pagina">
      <div>
        <h1>Meus agendamentos</h1>
        <p class="texto-suave">Acompanhe o status e gerencie suas próximas lavagens.</p>
      </div>
    </header>

    <div class="filtros">
      <button class="filtro ativo" data-filtro="todos">Todos</button>
      <button class="filtro" data-filtro="proximo">Próximos</button>
      <button class="filtro" data-filtro="concluido">Concluídos</button>
      <button class="filtro" data-filtro="cancelado">Cancelados</button>
    </div>

    <div id="lista-agendamentos"></div>
  </main>

  <dialog class="modal" id="modal-reagendar">
  <h2>Reagendar lavagem</h2>
  <form id="form-reagendar">
    <div class="campo"><label for="nova-data">Novo dia</label><input type="date" id="nova-data" required></div>
    <div class="campo"><label for="nova-hora">Novo horário de entrada</label><input type="time" id="nova-hora" required></div>
    <div class="modal-acoes">
      <button type="button" class="botao botao-claro" id="btn-fechar-reagendar">Voltar</button>
      <button type="submit" class="botao">Confirmar</button>
    </div>
  </form>
</dialog>

<script src="../js/sidebar.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/agendamentos.js"></script>
</body>
</html>
